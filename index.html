<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Apri Porta - NEASPACE</title>
  <script>
    function getLangMessages(lang) {
      const messages = {
        it: {
          opening: "✅ La porta è aperta!",
          error: "Caro ospite, la tua prenotazione è dal {start} al {end}.",
          notFound: "❌ Prenotazione non trovata",
          loading: "⏳ Controllo prenotazione in corso..."
        },
        en: {
          opening: "✅ The door is open!",
          error: "Dear guest, your reservation is from {start} to {end}.",
          notFound: "❌ Booking not found",
          loading: "⏳ Checking your booking..."
        }
      };
      return messages[lang] || messages['en'];
    }

    function excelDateToJSDate(serial) {
      const utc_days = Math.floor(serial - 25569);
      const utc_value = utc_days * 86400;
      return new Date(utc_value * 1000);
    }

    function formatDateString(date) {
      const d = date.getDate().toString().padStart(2, '0');
      const m = (date.getMonth() + 1).toString().padStart(2, '0');
      const y = date.getFullYear();
      return `${d}.${m}.${y}`;
    }

    window.onload = async function () {
      const bookingId = new URLSearchParams(window.location.search).get('b');
      const langCode = (navigator.language || 'en').substring(0, 2).toLowerCase();
      const msg = getLangMessages(langCode);

      document.body.innerHTML = `<h2>${msg.loading}</h2>`;
      if (!bookingId) {
        document.body.innerHTML = "<h2>❌ Booking number missing</h2>";
        return;
      }

      try {
        const response = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQYuzkKbQ6Hq8Idu9eZZd6qGzAhwV3QEiQbY8R07JZKffQtwbAkAy1R1fquX-ovFbFcmJcB2SGdBYk/pub?output=csv");
        const text = await response.text();
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

        const today = new Date();
        const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const cleanedBookingId = bookingId.replace(/[^0-9]/g, '');

        for (const line of lines) {
          const [rawId, startRaw, endRaw] = line.split(',').map(s => s.trim());
          const id = rawId.replace(/[^0-9]/g, '');
          if (id !== cleanedBookingId) continue;

          let start, end;

          if (startRaw.includes('-')) {
            const [d1, m1, y1] = startRaw.split('-');
            const [d2, m2, y2] = endRaw.split('-');
            start = new Date(`${y1}-${m1}-${d1}`);
            end = new Date(`${y2}-${m2}-${d2}`);
          } else {
            start = excelDateToJSDate(parseFloat(startRaw));
            end = excelDateToJSDate(parseFloat(endRaw));
          }

          if (isNaN(start) || isNaN(end)) {
            document.body.innerHTML = "<h2>⚠️ Errore nella data della prenotazione</h2>";
            return;
          }

          if (todayOnly >= start && todayOnly <= end) {
            const message = encodeURIComponent(msg.opening);
            const telegramUrl = "https://api.telegram.org/bot7637183669:AAGtDsA_uiFAgJjLjhXWoV8-GeIlxrfJfsk/sendMessage?chat_id=-1002537539305&text=" + message;
            fetch(telegramUrl).catch(console.error);
            document.body.innerHTML = `<h2>${msg.opening}</h2>`;
            setTimeout(() => window.close(), 3000);
            return;
          } else {
            const errorMsg = msg.error.replace("{start}", formatDateString(start)).replace("{end}", formatDateString(end));
            document.body.innerHTML = `<h2>${errorMsg}</h2>`;
            setTimeout(() => window.close(), 5000);
            return;
          }
        }

        document.body.innerHTML = `<h2>${msg.notFound}</h2>`;
        setTimeout(() => window.close(), 5000);

      } catch (error) {
        document.body.innerHTML = "<h2>⚠️ Errore nel caricamento dati</h2>";
        console.error(error);
      }
    };
  </script>
  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h2 {
      font-size: 28px;
      margin: 20px;
    }
  </style>
</head>
<body>
  <h2>⏳ Controllo prenotazione in corso...</h2>
</body>
</html>
