# Nuova versione robusta con gestione errori sulle date
safe_html = """<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Apri Porta - NEASPACE</title>
  <script>
    function getLangMessages(lang) {
      const messages = {
        it: {
          opening: "✅ La porta è aperta!",
          error: "Caro ospite, la tua prenotazione è dal {start} al {end}.",
          notFound: "❌ Prenotazione non trovata",
          loading: "⏳ Controllo prenotazione in corso..."
        },
        fr: {
          opening: "✅ La porte est ouverte !",
          error: "Cher invité, votre réservation est du {start} au {end}.",
          notFound: "❌ Réservation introuvable",
          loading: "⏳ Vérification de la réservation en cours..."
        },
        en: {
          opening: "✅ The door is open!",
          error: "Dear guest, your reservation is from {start} to {end}.",
          notFound: "❌ Booking not found",
          loading: "⏳ Checking your booking..."
        },
        es: {
          opening: "✅ ¡La puerta está abierta!",
          error: "Estimado huésped, su reserva es del {start} al {end}.",
          notFound: "❌ Reserva no encontrada",
          loading: "⏳ Verificando su reserva..."
        }
      };
      return messages[lang] || messages['en'];
    }

    window.onload = async function () {
      const urlParams = new URLSearchParams(window.location.search);
      const bookingId = urlParams.get('b');
      const langCode = (navigator.language || 'en').substring(0, 2).toLowerCase();
      const msg = getLangMessages(langCode);

      document.body.innerHTML = `<h2>${msg.loading}</h2>`;
      console.log("🌐 Lingua rilevata:", langCode);
      console.log("🔍 Booking ID ricevuto:", bookingId);

      if (!bookingId) {
        document.body.innerHTML = "<h2>❌ Booking number missing</h2>";
        setTimeout(() => window.close(), 5000);
        return;
      }

      try {
        const response = await fetch("https://franchino1982.github.io/neagram-door/BookingList.csv");
        const text = await response.text();
        const lines = text.split('\\n');

        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        console.log("📅 Oggi è:", todayStr);

        let found = false;
        const cleanedBookingId = bookingId.replace(/[^0-9]/g, '');

        for (const line of lines) {
          const parts = line.split(',');
          if (parts.length < 3) continue;

          const [rawId, startRaw, endRaw] = parts.map(v => v.trim());
          const id = rawId.replace(/[^0-9]/g, '');
          if (!id || !startRaw || !endRaw) continue;

          if (id === cleanedBookingId) {
            console.log("✅ Prenotazione trovata:", id, startRaw, endRaw);

            try {
              const [d1, m1, y1] = startRaw.split('.');
              const [d2, m2, y2] = endRaw.split('.');
              const start = new Date(`20${y1}-${m1}-${d1}`);
              const end = new Date(`20${y2}-${m2}-${d2}`);

              console.log("📆 Check-in:", start.toISOString().split('T')[0]);
              console.log("📆 Check-out:", end.toISOString().split('T')[0]);

              if (today >= start && today <= end) {
                const message = encodeURIComponent(msg.opening);
                const telegramUrl = "https://api.telegram.org/bot7637183669:AAGtDsA_uiFAgJjLjhXWoV8-GeIlxrfJfsk/sendMessage?chat_id=-1002537539305&text=" + message;

                console.log("🚀 Inviando messaggio Telegram:", telegramUrl);
                fetch(telegramUrl)
                  .then(() => console.log("📨 Messaggio inviato con successo"))
                  .catch(error => console.error("❌ Errore invio messaggio:", error));

                document.body.innerHTML = `<h2>${msg.opening}</h2>`;
                setTimeout(() => window.close(), 3000);
              } else {
                const errorMsg = msg.error.replace("{start}", startRaw).replace("{end}", endRaw);
                console.log("📛 Prenotazione non valida per oggi");
                document.body.innerHTML = `<h2>${errorMsg}</h2>`;
                setTimeout(() => window.close(), 5000);
              }

              found = true;
              break;
            } catch (dateErr) {
              console.error("❌ Errore parsing date:", dateErr);
              continue;
            }
          }
        }

        if (!found) {
          console.log("❌ Nessuna prenotazione trovata per questo ID");
          document.body.innerHTML = `<h2>${msg.notFound}</h2>`;
          setTimeout(() => window.close(), 5000);
        }

      } catch (error) {
        document.body.innerHTML = "<h2>⚠️ Errore nel caricamento dati</h2>";
        console.error("⚠️ Errore fetch CSV:", error);
        setTimeout(() => window.close(), 5000);
      }
    };
  </script>
  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h2 {
      font-size: 28px;
      margin: 20px;
    }
    p {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h2>⏳ Controllo prenotazione in corso...</h2>
</body>
</html>
"""

# Salvo il file HTML aggiornato
safe_html_path = "/mnt/data/index.html"
with open(safe_html_path, "w", encoding="utf-8") as f:
    f.write(safe_html)

safe_html_path
