<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Apri Porta - NEASPACE</title>
  <script>
    function getLangMessages(lang) {
      const messages = {
        it: {
          opening: "Benvenuto! 🌞 La tua avventura a NeaSpace inizia ora: la porta è aperta, sali al secondo piano, porta destra e recupera le chiavi dalla keybox sulla porta con il codice 0204. Mandaci un messaggino per confermare che siete a casa!",
          error: "Caro ospite, la tua prenotazione è valida dal {start} al {end}. La porta si aprirà solo in quelle date!",
          notFound: "Ops! Non riusciamo a trovare la tua prenotazione. Verifica il numero e riprova, oppure contattaci per assistenza (Francesco +971582537673 o +393283887637).",
          loading: "⏳ Controllo prenotazione in corso..."
        },
        en: {
          opening: "Welcome! 🌞 Your NeaSpace adventure starts now: the door is open, go to the second floor, right door, and collect the keys from the keybox on the door using code 0204. Please send us a message to confirm you've arrived!",
          error: "Dear guest, your reservation is from {start} to {end}. The door will open only during these dates!",
          notFound: "Oops! We couldn't find your booking. Please check the number and try again, or contact us for assistance (Francesco +971582537673 or +393283887637).",
          loading: "⏳ Checking your booking..."
        },
        fr: {
          opening: "Bienvenue ! 🌞 Votre aventure NeaSpace commence maintenant : la porte est ouverte, montez au deuxième étage, porte à droite, et récupérez les clés dans la boîte à clés sur la porte avec le code 0204. Merci de nous envoyer un message pour confirmer que vous êtes bien arrivés !",
          error: "Cher invité, votre réservation est valable du {start} au {end}. La porte ne s'ouvrira que pendant ces dates !",
          notFound: "Oups ! Nous n'avons pas trouvé votre réservation. Vérifiez le numéro et réessayez, ou contactez-nous pour assistance (Francesco +971582537673 ou +393283887637).",
          loading: "⏳ Vérification de votre réservation..."
        },
        es: {
          opening: "¡Bienvenido! 🌞 Tu aventura en NeaSpace comienza ahora: la puerta está abierta, sube al segundo piso, puerta a la derecha y recoge las llaves de la caja en la puerta con el código 0204. Envíanos un mensaje para confirmar que has llegado!",
          error: "Estimado huésped, su reserva es válida del {start} al {end}. ¡La puerta solo se abrirá en esas fechas!",
          notFound: "¡Ups! No pudimos encontrar su reserva. Verifique el número e inténtelo de nuevo, o contáctenos para obtener ayuda (Francesco +971582537673 o +393283887637).",
          loading: "⏳ Verificando su reserva..."
        }
      };
      return messages[lang] || messages['en'];
    }

    function excelDateToJSDate(serial) {
      const utc_days = Math.floor(serial - 25569);
      const utc_value = utc_days * 86400;
      return new Date(utc_value * 1000);
    }

    function formatDateString(date) {
      const d = date.getDate().toString().padStart(2, '0');
      const m = (date.getMonth() + 1).toString().padStart(2, '0');
      const y = date.getFullYear();
      return `${d}.${m}.${y}`;
    }

    window.onload = async function () {
      const bookingId = new URLSearchParams(window.location.search).get('b');
      const langCode = (navigator.language || 'en').substring(0, 2).toLowerCase();
      const msg = getLangMessages(langCode);

      document.body.innerHTML = `<h2>${msg.loading}</h2>`;
      if (!bookingId) {
        document.body.innerHTML = "<h2>❌ Booking number missing</h2>";
        return;
      }

      try {
        const response = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTuVXZX_f2tzwp9--JCHERAv8eeBKYrGQQz-sR3xNUs9kperUfI_O3-JQ4RIRK1V-o3BuRe8fhKN6NE/pub?output=csv");
        const text = await response.text();
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

        const today = new Date();
        const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const cleanedBookingId = bookingId.replace(/[^0-9]/g, '');

        for (const line of lines) {
          const [rawId, startRaw, endRaw] = line.split(',').map(s => s.trim());
          const id = rawId.replace(/[^0-9]/g, '');
          if (id !== cleanedBookingId) continue;

          let start, end;

          if (startRaw.includes('-')) {
            const [d1, m1, y1] = startRaw.split('-');
            const [d2, m2, y2] = endRaw.split('-');
            start = new Date(`${y1}-${m1}-${d1}`);
            end = new Date(`${y2}-${m2}-${d2}`);
          } else {
            start = excelDateToJSDate(parseFloat(startRaw));
            end = excelDateToJSDate(parseFloat(endRaw));
          }

          if (isNaN(start) || isNaN(end)) {
            document.body.innerHTML = "<h2>⚠️ Errore nella data della prenotazione</h2>";
            return;
          }

          if (todayOnly >= start && todayOnly <= end) {
            const message = encodeURIComponent(msg.opening);
            const telegramUrl = "https://api.telegram.org/bot7637183669:AAGtDsA_uiFAgJjLjhXWoV8-GeIlxrfJfsk/sendMessage?chat_id=-1002537539305&text=" + message;
            fetch(telegramUrl).catch(console.error);
            document.body.innerHTML = `<h2>${msg.opening}</h2>`;
            setTimeout(() => window.close(), 12000);
            return;
          } else {
            const errorMsg = msg.error.replace("{start}", formatDateString(start)).replace("{end}", formatDateString(end));
            document.body.innerHTML = `<h2>${errorMsg}</h2>`;
            setTimeout(() => window.close(), 5000);
            return;
          }
        }

        document.body.innerHTML = `<h2>${msg.notFound}</h2>`;
        setTimeout(() => window.close(), 5000);

      } catch (error) {
        document.body.innerHTML = "<h2>⚠️ Errore nel caricamento dati</h2>";
        console.error(error);
      }
    };
  </script>
  <style>
    body {
      background-color: #A2D5F2; /* Blu Pastello */
      color: #333;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h2 {
      font-size: 28px;
      margin: 20px;
      color: #F5B7B1; /* Corallo Soft */
    }
  </style>
</head>
<body>
  <h2>⏳ Controllo prenotazione in corso...</h2>
</body>
</html>
